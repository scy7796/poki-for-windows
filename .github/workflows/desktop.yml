# Builds Poki Setup (desktop/) for Windows (NSIS setup.exe) with the Tauri shell, after the core tests.
# The macOS app is native SwiftUI and builds in desktop-mac.yml. Runs on demand, on a desktop-vX.Y.Z
# tag, or on dev/desktop-* branch pushes on the fork only.
name: desktop

on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the installers to a GitHub release (needs a desktop-v* tag)
        type: boolean
        default: false
  push:
    tags: ['desktop-v*.*.*']
    # Branch pushes build only on the fork (ZhehanZhang/poki-remote), never upstream: the jobs
    # below check the repository.
    branches: ['dev/desktop-*']

# A newer push to the same branch replaces a build still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  core:
    name: core tests (Linux)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.repository == 'ZhehanZhang/poki-remote'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p poki-setup-core -p poki-setup-cli --manifest-path desktop/Cargo.toml
        env: { POKI_SETUP_FILE_SECRETS: "1" }

  build:
    name: ${{ matrix.name }}
    # Runs beside the core tests, not after them: the tests gate nothing the installer needs.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.repository == 'ZhehanZhang/poki-remote'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build number
        shell: bash
        run: echo "POKI_SETUP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      # The compiled crates are kept even when a run fails, so the next run does not start cold.
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, cache-on-failure: true, shared-key: windows-release }
      # The bundler's NSIS toolset (%LOCALAPPDATA%\tauri), kept between runs: the GitHub release
      # downloads it otherwise makes often answer 50x, and the bundler does not retry them.
      - name: Bundler tools from cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ hashFiles('desktop/app/package-lock.json') }}
          restore-keys: tauri-tools-
      - run: npm ci --no-audit --no-fund --prefer-offline
        working-directory: desktop/app
      # poki-setup.exe, the command line tool for agents and scripts, installs next to the app
      # (tauri.windows.conf.json lists it as a resource).
      - name: Command line tool
        shell: bash
        run: |
          cargo build --release -p poki-setup-cli --manifest-path desktop/Cargo.toml
          desktop/target/release/poki-setup.exe --version
          desktop/target/release/poki-setup.exe prompt | grep -q "next --json"
      # Only the NSIS setup.exe is built: it is what people and the self-update download (it
      # carries English and Chinese). The MSIs doubled the bundling time and needed WiX.
      - name: Build the installer
        shell: bash
        working-directory: desktop/app
        run: |
          for i in 1 2 3; do
            npx tauri build --bundles nsis && exit 0
            echo "Bundling failed (try $i); trying again."
            sleep 10
          done
          exit 1
      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p out
          find desktop/target -path '*/release/bundle/*' -name '*-setup.exe' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: poki-setup-${{ runner.os }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && inputs.release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber
