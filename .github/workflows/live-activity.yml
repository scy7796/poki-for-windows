# The Live Activity's screenshots: builds the Poki app for the iOS Simulator and photographs every
# phase of the Live Activity, both as the app's own preview (the widget's views at the system's sizes)
# and as a real Live Activity on the simulator's Dynamic Island and Lock Screen, including the expanded
# island an alert opens.
name: Live Activity

on:
  # Manual only (Actions > Run workflow), so nothing runs on every push in this repository.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: PokiLauncher for the simulator
        run: |
          set -euo pipefail
          native/launcher/fetch-idevice.sh
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml

      - name: Assets and project
        run: |
          native/ios-app/scripts/make-assets.sh
          brew install xcodegen
          xcodegen generate --spec native/ios-app/project.yml

      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          # Signed ad hoc, so the App Group (the thumbnail file) and Live Activities work.
          xcodebuild build \
            -project native/ios-app/Poki.xcodeproj -scheme Poki -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ARCHS=arm64 2>&1 | tee build/sim.log | grep -E "error:|warning: .*Activity|BUILD (SUCCEEDED|FAILED)" || true
          grep -q 'BUILD SUCCEEDED' build/sim.log
          test -d build/sim/Build/Products/Debug-iphonesimulator/Poki.app/PlugIns/PokiWidgets.appex

      - name: Screenshots
        run: |
          set -uo pipefail
          APP=build/sim/Build/Products/Debug-iphonesimulator/Poki.app
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"];print(r[-1]["identifier"])')
          # The newest iPhone Pro (it has the Dynamic Island), by model number, not by list order.
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,re,sys;d=[x for x in json.load(sys.stdin)["devicetypes"] if re.fullmatch(r"iPhone \d+ Pro",x["name"])];d.sort(key=lambda x:int(re.search(r"\d+",x["name"]).group()));print(d[-1]["identifier"])')
          echo "runtime $RUNTIME, device $TYPE"
          UDID=$(xcrun simctl create poki-la "$TYPE" "$RUNTIME")
          boot() { xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null; xcrun simctl ui "$UDID" appearance dark; }
          boot
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          sleep 5
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p shots/preview shots/real
          shot() { xcrun simctl io "$UDID" screenshot "$1" > /dev/null 2>&1 || echo "no screenshot $1"; }
          # 1. The app's preview of each phase, in light and dark.
          for look in dark light; do
            xcrun simctl ui "$UDID" appearance "$look"
            for s in start working step approval yourturn passcode done ready idle problem pairing code setup; do
              xcrun simctl terminate "$UDID" nz.zheha.poki > /dev/null 2>&1 || true
              xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen activity -pokiActivityState "$s" > /dev/null
              sleep 3
              shot "shots/preview/$s-$look.png"
            done
          done
          xcrun simctl ui "$UDID" appearance dark
          osascript -e 'tell application "Simulator" to activate' || true
          # 2. Real Live Activities: compact island, the alert's expanded island, then the Lock Screen.
          for s in working approval yourturn code done setup problem ready; do
            xcrun simctl terminate "$UDID" nz.zheha.poki > /dev/null 2>&1 || true
            xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen activity -pokiActivityDemo "$s" > /dev/null
            sleep 2
            xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
            sleep 1.5
            alert() { xcrun simctl spawn "$UDID" notifyutil -p nz.zheha.poki.demo-alert; }
            # An alert while another app is in front expands the island; then the compact island.
            alert; sleep 0.4; shot "shots/real/$s-alert.png"
            shot "shots/real/$s-compact.png"
            # Lock the simulator (Device > Lock, Cmd-L), then an alert on the Lock Screen.
            osascript -e 'tell application "Simulator" to activate' -e 'tell application "System Events" to keystroke "l" using command down' 2>&1 || echo "lock keystroke failed"
            sleep 1; shot "shots/real/$s-lock.png"
            alert; sleep 0.4; shot "shots/real/$s-lock-alert.png"
            xcrun simctl shutdown "$UDID"; boot
          done
          ls -R shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-activity-shots
          path: shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-activity-build-log
          path: build/sim.log
