# Builds Poki's on-phone runner (WebDriverAgentRunner from the vendored Appium WebDriverAgent,
# branded as Poki) as an unsigned IPA. It is signed when it is installed (with the person's signing tool
# and Apple ID, the same as Poki). There is no other build path: the Mac in use has no Xcode.
name: iOS runner

on:
  # Manual only (Actions > Run workflow), so nothing runs on every push in this repository.
  workflow_dispatch:
  # The release workflow builds the runner from the tagged commit with the release's version.
  workflow_call:
    inputs:
      version: { type: string, required: true }
      build: { type: string, required: true }

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PRODUCTS: build/wda/Build/Products/Debug-iphoneos
      RUNNER: WebDriverAgentRunner-Runner.app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show the toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Apply Poki's runner patch (opened by hand it sends people to Poki; its screen while in use)
        run: cd native/ios-runner/WebDriverAgent && git apply < "$GITHUB_WORKSPACE/native/ios-runner/patches/wda-poki-runner.patch" && git diff --stat

      - name: Build for testing (iOS device SDK, unsigned)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project native/ios-runner/WebDriverAgent/WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination generic/platform=iOS \
            -derivedDataPath build/wda \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 DEBUG_INFORMATION_FORMAT=dwarf | tee build/xcodebuild.log | grep -E "^(error|warning: .*error)|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          test -d "$PRODUCTS/$RUNNER"

      - name: Brand as Poki
        run: native/ios-runner/branding/brand.sh "$PRODUCTS/$RUNNER" docs/images/poki-icon.png docs/images/runner/AppIcon-1024.png

      - name: PokiRunnerHost (opened by hand, the runner starts no test and sends people to Poki)
        run: native/ios-runner/host/install.sh "$PRODUCTS/$RUNNER" iphoneos

      - name: Version (the same version and build number as Poki in a release)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"; BUILD="${{ inputs.build }}"
          [ -n "$VERSION" ] || VERSION=$(cat native/ios-app/VERSION 2>/dev/null || echo 0.2.0)
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PRODUCTS/$RUNNER/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PRODUCTS/$RUNNER/Info.plist"
          echo "Poki Runner $VERSION ($BUILD)"

      - name: Package the IPA
        run: |
          set -euo pipefail
          rm -rf Payload out && mkdir -p Payload out
          ditto "$PRODUCTS/$RUNNER" "Payload/$RUNNER"
          find Payload -name '*.dSYM' -prune -exec rm -rf {} +
          # As WebDriverAgent's own real-device package does: the XCTest libraries Xcode copied into the
          # runner come from the phone's developer image instead.
          find "Payload/$RUNNER/Frameworks" -mindepth 1 -maxdepth 1 ! -name libPokiRunnerHost.dylib -exec rm -rf {} +
          ls "Payload/$RUNNER/Frameworks"
          ditto -c -k --keepParent --norsrc Payload out/poki-runner-unsigned.ipa
          # The same runner keeping Xcode's copies, for an install that runs it without the developer image.
          mkdir -p full/Payload && ditto "$PRODUCTS/$RUNNER" "full/Payload/$RUNNER" && find full -name '*.dSYM' -prune -exec rm -rf {} +
          (cd full && ditto -c -k --keepParent --norsrc Payload ../out/poki-runner-unsigned-with-frameworks.ipa)
          (cd out && shasum -a 256 *.ipa | tee SHA256SUMS)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "Payload/$RUNNER/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$RUNNER/Info.plist"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: poki-runner-unsigned
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
