# Promote to Alpha (fast): the same as Promote to Alpha without the tests. Takes a pre-alpha (by
# default the one on app-prealpha-latest) and puts that same IPA, with its Poki Setup files, into
# app-alpha-latest (and the old ios-alpha-latest) as app-<VERSION>-alpha.<build>. About a minute.
name: Promote to Alpha (fast)

on:
  workflow_dispatch:
    inputs:
      prealpha:
        description: "Pre-alpha tag to promote, like app-0.3.0-prealpha.712 (empty: the one on app-prealpha-latest)"
        type: string
        required: false
        default: ''

concurrency:
  group: promote-alpha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
      build: ${{ steps.r.outputs.build }}
      run: ${{ steps.r.outputs.run }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANT: ${{ inputs.prealpha }}
        run: |
          set -euo pipefail
          if [ -z "$WANT" ]; then
            ipa="$(gh release view app-prealpha-latest --json assets --jq '.assets[].name' | grep -E '^Poki-external-.*\.ipa$' | head -1)"
            stem="${ipa#Poki-external-}"; stem="${stem%.ipa}"
            WANT="app-${stem%-*}-prealpha.${stem##*-}"
          fi
          [[ "$WANT" =~ ^app-([0-9]+\.[0-9]+\.[0-9]+)-prealpha\.([0-9]+)$ ]] || { echo "::error::$WANT is not app-X.Y.Z-prealpha.N"; exit 1; }
          version="${BASH_REMATCH[1]}" build="${BASH_REMATCH[2]}"
          sha="$(gh api "repos/$GH_REPO/commits/$WANT" --jq .sha)"
          # The pre-alpha run that built this commit; its artifact is the file to promote.
          run="$(gh run list --workflow prealpha.yml --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')"
          [ -n "$run" ] || { echo "::error::no successful Pre-alpha run built $sha (artifacts are kept 90 days)"; exit 1; }
          if gh api "repos/$GH_REPO/git/refs/tags/app-$version-alpha.$build" >/dev/null 2>&1; then
            echo "::error::app-$version-alpha.$build already exists"; exit 1
          fi
          echo "Promoting $WANT ($sha), Pre-alpha run $run"
          { echo "sha=$sha"; echo "version=$version"; echo "build=$build"; echo "run=$run"; } >> "$GITHUB_OUTPUT"
          echo "## Promote $WANT to Alpha" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}", fetch-depth: 0, filter: 'tree:0' }
      # The publishing script from this workflow's commit, so older pre-alphas can be promoted too.
      - uses: actions/checkout@v4
        with: { path: pipeline, sparse-checkout: .github/scripts }
      - name: The pre-alpha's IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ needs.resolve.outputs.run }}" --name Poki-unsigned --dir app
      - name: Publish to app-alpha-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipeline/.github/scripts/publish-rolling.sh alpha "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.build }}" app app-prealpha-latest
