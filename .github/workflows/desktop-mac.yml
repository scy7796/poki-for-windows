# Builds the native macOS Poki Setup (SwiftUI shell + Rust bridge), checks it end to end as far as
# a Mac without an iPhone allows, and saves the DMG plus screenshots of every page.
# Branch pushes build on the fork only. A commit message with [universal], a tag or a manual run builds for Intel too.
name: desktop-mac

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*.*.*']
    branches: ['dev/desktop-*']

# A newer push to the same branch replaces a build still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  actions: read

jobs:
  mac:
    if: github.repository == 'ZhehanZhang/poki-remote' || startsWith(github.ref, 'refs/tags/')
    # macOS 26 with Xcode 26: the SDK with Liquid Glass. The app still runs on macOS 14 and 15,
    # which the fallback job below checks.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, cache-on-failure: true }
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcode-select -p
          swift --version
          sw_vers
      # Developer ID signing and notarization, when the repository has the secrets (see
      # desktop/mac/README.md). Without them the app is signed ad hoc, as before.
      - name: Developer ID certificate
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No MACOS_CERT_P12 secret: signing ad hoc."; exit 0; fi
          KC="$RUNNER_TEMP/poki-sign.keychain-db"
          KCPW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$ID" ]; then echo "::error::The certificate in MACOS_CERT_P12 is not a Developer ID Application certificate."; security find-identity -v -p codesigning "$KC"; exit 1; fi
          echo "Signing as: $ID"
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build the app and DMG
        env:
          MODE: ${{ (contains(github.event.head_commit.message, '[universal]') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 'universal' || 'native' }}
        run: desktop/mac/scripts/bundle.sh "$MODE" "$PWD/dist"
      - name: Notarize
        env:
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${MAC_SIGN_IDENTITY:-}" ]; then echo "Signed ad hoc: nothing to notarize."; exit 0; fi
          DMG=$(ls dist/*.dmg)
          if [ -n "$KEY_ID" ] && [ -n "$KEY_P8" ]; then
            printf '%s' "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
            AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" ${ISSUER:+--issuer "$ISSUER"})
          elif [ -n "$APPLE_ID" ] && [ -n "$APP_PASSWORD" ] && [ -n "$TEAM_ID" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID")
          else
            echo "::error::Developer ID signing is set up but notarization secrets are missing (NOTARY_KEY_ID + NOTARY_KEY_P8 + NOTARY_ISSUER_ID, or NOTARY_APPLE_ID + NOTARY_APP_PASSWORD + APPLE_TEAM_ID)."
            exit 1
          fi
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          SUB=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
          STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUB" "${AUTH[@]}" || true
            echo "::error::Notarization: $STATUS"; exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler staple "dist/Poki Setup.app"
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "== Gatekeeper"
          spctl -a -vv -t exec "dist/Poki Setup.app"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      # The DMG is uploaded as soon as it exists, so it can be fetched while the checks below run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poki-setup-macos
          path: dist/*.dmg
          if-no-files-found: error
      - name: Keep the app for the older-macOS check
        if: always()
        run: ditto -c -k --keepParent "dist/Poki Setup.app" dist/PokiSetup-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poki-setup-macos-app
          path: dist/PokiSetup-app.zip
          retention-days: 3
      - name: Command line tool for agents
        run: |
          CLI="$PWD/dist/Poki Setup.app/Contents/MacOS/poki-setup"
          "$CLI" --version
          "$CLI" prompt | grep -q "next --json"
          "$CLI" next --json | python3 -c 'import json,sys; n=json.load(sys.stdin); assert n["steps"], n; print(n["summary"])'
          set +e; echo "" | "$CLI" login nobody@example.com --password-stdin --json; CODE=$?; set -e
          test "$CODE" = 2
      - name: Core and bridge check against Apple
        run: python3 desktop/mac/scripts/e2e.py "$PWD/dist/Poki Setup.app/Contents/MacOS/poki-setup-bridge"
      - name: Signing check with Apple's codesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd desktop && cargo build --release -p poki-setup-cli)
          WF=$(gh api repos/${{ github.repository }}/actions/workflows --jq '.workflows[]|select(.name=="iOS app")|.id')
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=dev/ios-integration-sync&status=success&per_page=1" --jq '.workflow_runs[0].id')
          echo "Poki IPA from iOS app run $RUN"
          gh run download "$RUN" -R ${{ github.repository }} -n Poki-unsigned -D ipa
          desktop/mac/scripts/sign-check.sh desktop/target/release/poki-setup ipa/Poki-external-unsigned.ipa ipa/Poki-signing.zip
      - name: Screenshots
        if: always()
        run: |
          APP="$PWD/dist/Poki Setup.app/Contents/MacOS/PokiSetup"
          mkdir -p shots
          POKI_SETUP_DEMO=1 POKI_SETUP_SNAPSHOT_DIR="$PWD/shots" perl -e 'alarm shift; exec { $ARGV[0] } @ARGV' 180 "$APP" || echo "demo run ended with $?"
          POKI_SETUP_SNAPSHOT_DIR="$PWD/shots" perl -e 'alarm shift; exec { $ARGV[0] } @ARGV' 180 "$APP" || echo "live run ended with $?"
          ls -la shots
          test -n "$(ls shots)" || { echo 'no screenshots were saved'; exit 1; }
      - name: Remove the signing keychain
        if: always()
        run: if [ -n "${MAC_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$MAC_SIGN_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poki-setup-macos-screenshots
          path: shots/

  # The same build on macOS 15, where there is no Liquid Glass: it must open and draw every page
  # with the material fallback.
  fallback:
    needs: mac
    if: always() && needs.mac.result == 'success'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: poki-setup-macos-app }
      - name: Screenshots on macOS 15
        run: |
          sw_vers
          ditto -x -k PokiSetup-app.zip .
          APP="$PWD/Poki Setup.app/Contents/MacOS/PokiSetup"
          mkdir -p shots
          POKI_SETUP_DEMO=1 POKI_SETUP_SNAPSHOT_DIR="$PWD/shots" perl -e 'alarm shift; exec { $ARGV[0] } @ARGV' 180 "$APP" || echo "demo run ended with $?"
          for f in shots/*.png; do mv "$f" "shots/macos15-$(basename "$f")"; done
          ls -la shots
          test -n "$(ls shots)" || { echo 'no screenshots were saved'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: poki-setup-macos15-screenshots
          path: shots/
