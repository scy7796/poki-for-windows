# An Alpha or Pre-alpha release: push a tag app-X.Y.Z-alpha.N or app-X.Y.Z-prealpha.N
# (native/ios-app/scripts/cut-release.sh alpha|pre-alpha makes one). The older ios-alpha-X.Y.Z-N and
# ios-prealpha-X.Y.Z-N tags still work.
# X.Y.Z is native/ios-app/VERSION at the tagged commit and N is its commit count, so every commit has
# one build number and later commits on a branch always get bigger ones. Builds Poki from that commit
# and puts into the channel's rolling prereleases (app-alpha-latest / app-prealpha-latest, mirrored to
# ios-alpha-latest / ios-prealpha-latest for installed apps and Poki Setup that read only those) Poki-external-X.Y.Z-N.ipa, Poki-X.Y.Z-N.ipa,
# Poki-signing.zip and SHA256SUMS: the same files as an ios-v* release, so Poki Setup installs it
# the same way. Alphas are builds picked for early testers; pre-alphas are untested snapshots. Each
# reaches people who chose that channel (or a less stable one) in Poki Setup. See docs/release-channels.md.
name: Alpha and pre-alpha

on:
  # Tag-only: never runs on branch pushes. The fallback to prealpha.yml and promote-alpha.yml.
  push:
    tags: ['app-*-alpha.*', 'app-*-prealpha.*', 'ios-alpha-*', 'ios-prealpha-*', '!app-alpha-latest', '!app-prealpha-latest', '!ios-alpha-latest', '!ios-prealpha-latest']

permissions:
  contents: read

concurrency:
  group: channel-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      channel: ${{ steps.v.outputs.channel }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n' < native/ios-app/VERSION)"
          BUILD="$(git rev-list --count HEAD)"
          case "$GITHUB_REF_NAME" in
            app-*-prealpha.*|ios-prealpha-*) CHANNEL=prealpha; TITLE=Pre-alpha ;;
            app-*-alpha.*|ios-alpha-*) CHANNEL=alpha; TITLE=Alpha ;;
            *) echo "::error::tags look like app-X.Y.Z-alpha.N or app-X.Y.Z-prealpha.N"; exit 1 ;;
          esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::native/ios-app/VERSION is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_NAME" != "app-$VERSION-$CHANNEL.$BUILD" ] && [ "$GITHUB_REF_NAME" != "ios-$CHANNEL-$VERSION-$BUILD" ]; then
            echo "::error::this commit is Poki $VERSION ($BUILD), so its tag must be app-$VERSION-$CHANNEL.$BUILD (native/ios-app/scripts/cut-release.sh names it for you)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

  app:
    needs: version
    uses: ./.github/workflows/ios-ipa.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}
      # External only: the edition Poki Setup installs. The local one (built-in VPN) needs Network Extension signing.
      editions: external

  publish:
    needs: [version, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: Poki-unsigned, path: app }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          TITLE: ${{ needs.version.outputs.title }}
        run: |
          set -euo pipefail
          mkdir release
          if [ -f app/Poki-unsigned.ipa ]; then cp app/Poki-unsigned.ipa "release/Poki-$VERSION-$BUILD.ipa"; fi
          cp app/Poki-external-unsigned.ipa "release/Poki-external-$VERSION-$BUILD.ipa"
          cp app/Poki-signing.zip release/
          # The relay Worker from this commit, so Poki Setup deploys the relay that matches this release.
          cp deploy/cf-relay/worker.js release/poki-relay-worker.js
          (cd release && sha256sum *.ipa poki-relay-worker.js > SHA256SUMS && cat SHA256SUMS)
          # One rolling release per channel (app-alpha-latest, app-prealpha-latest): each cut replaces its
          # Poki files, title and notes, so the Releases page keeps one Alpha and one Pre-alpha beside the
          # versioned Stable and Beta releases. The versioned tag that started this run stays as the
          # record of what was built. Poki Setup reads the version from the IPA's name and keeps its
          # own PokiSetup-* files and SHA256SUMS-desktop.txt on the release untouched.
          # app-$CHANNEL-latest is the rolling release; ios-$CHANNEL-latest is its mirror with the same files
          # and title, kept until installed apps and Poki Setup read app-* tags.
          ROLLING="app-$CHANNEL-latest"
          MIRROR="ios-$CHANNEL-latest"
          # What changed since the previous cut on this channel (or the last 15 commits for the first one).
          previous="$( { git tag --list "app-*-$CHANNEL.*" --sort=-creatordate; git tag --list "ios-$CHANNEL-*" --sort=-creatordate; } | grep -vx "$GITHUB_REF_NAME" | grep -vx "$ROLLING" | grep -vx "$MIRROR" | head -1 || true)"
          if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" HEAD; then
            range="$previous..HEAD"; since="since $previous"
          else
            range="-15"; since="(latest commits)"
          fi
          {
            if [ "$CHANNEL" = prealpha ]; then
              echo "Pre-alpha: Poki $VERSION ($BUILD), built from $(git rev-parse --short HEAD) (tag $GITHUB_REF_NAME). An untested snapshot for the Pre-alpha channel in Poki Setup; it can break. Use the Beta or Stable channel for anything you rely on. This release is updated in place with every pre-alpha."
            else
              echo "Alpha: Poki $VERSION ($BUILD), built from $(git rev-parse --short HEAD) (tag $GITHUB_REF_NAME). An early build for the Alpha channel in Poki Setup; expect rough edges. Use the Beta or Stable channel for anything you rely on. This release is updated in place with every alpha."
            fi
            echo
            echo "Install Poki-external with Poki Setup, or sign either IPA with your own tool (entitlements in Poki-signing.zip). See native/ios-app/README.md."
            echo
            echo "Relay: Poki Setup's Update Relay deploys this release's relay Worker. To update it yourself, download [poki-relay-worker.js](https://github.com/$GITHUB_REPOSITORY/releases/download/$ROLLING/poki-relay-worker.js) (SHA-256 in SHA256SUMS), open your poki-relay Worker in the Cloudflare dashboard, choose Edit code, replace everything with this file and deploy; its settings and secret stay. For a new relay, use deploy/cf-relay/deploy.sh."
            echo
            echo "### Changes $since"
            git log --no-merges --format='- %s (%h)' $range | head -60
          } > notes.md
          publish() {
            rel="$1"
            if gh release view "$rel" >/dev/null 2>&1; then
              # Drop the previous Poki files (not Poki Setup's), then put the new ones in.
              gh release view "$rel" --json assets --jq '.assets[].name' | grep -E '^(Poki-.*\.ipa|Poki-signing\.zip|poki-relay-worker\.js|SHA256SUMS)$' | while read -r name; do
                gh release delete-asset "$rel" "$name" --yes
              done
              gh release upload "$rel" release/* --clobber
              gh release edit "$rel" --title "Poki v$VERSION ($BUILD) $TITLE" --notes-file notes.md --prerelease --latest=false
              # Point the rolling tag at this build's commit (best effort: a tag rule may keep it still).
              git tag -f "$rel" HEAD && git push -f origin "refs/tags/$rel" || echo "::warning::$rel was not moved; the release's files are updated"
            else
              gh release create "$rel" release/* --target "$(git rev-parse HEAD)" \
                --title "Poki v$VERSION ($BUILD) $TITLE" --notes-file notes.md --prerelease --latest=false
            fi
          }
          publish "$ROLLING"
          publish "$MIRROR"
          # A new app-* rolling release starts without Poki Setup's files: copy them over from the mirror.
          have="$(gh release view "$ROLLING" --json assets --jq '.assets[].name')"
          mkdir -p setup
          gh release view "$MIRROR" --json assets --jq '.assets[].name' | grep -E '^(PokiSetup-.*|SHA256SUMS-desktop\.txt)$' | while read -r name; do
            if ! printf '%s\n' "$have" | grep -qx "$name"; then
              gh release download "$MIRROR" --pattern "$name" --dir setup --clobber
              gh release upload "$ROLLING" "setup/$name" --clobber
            fi
          done
