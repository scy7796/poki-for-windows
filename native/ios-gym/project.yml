# Poki Gym: a small app for the iOS Simulator with one screen per hard case for UI automation
# (animation that never idles, alerts, the paste prompt, long lists, sheets, late focus, dense and
# duplicated trees, a web view, a navigation stack). Opened with pokigym://<scenario>. Built by
# .github/workflows/ios-gym.yml for the simulator; the ios-core simulator job installs it.
name: PokiGym
options:
  bundleIdPrefix: nz.zheha.poki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PokiGym:
    type: application
    platform: iOS
    sources: [Gym]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.zheha.poki.gym
    info:
      path: Gym/Info.plist
      properties:
        CFBundleDisplayName: Poki Gym
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: nz.zheha.poki.gym
            CFBundleURLSchemes: [pokigym]
